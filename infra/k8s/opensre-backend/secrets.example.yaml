# Example Secret for the in-cluster OpenSRE backend.
#
# DO NOT COMMIT real values. Create the real Secret with:
#
#   kubectl -n opensre create secret generic opensre-backend-secrets \
#     --from-literal=OPENROUTER_API_KEY='...' \
#     --from-literal=GITHUB_TOKEN='...' \
#     --from-literal=SLACK_WEBHOOK_URL='https://hooks.slack.com/services/...'
#
# All three are optional (`optional: true` in backend.yaml):
#   OPENROUTER_API_KEY  needed only for the OpenSRE RCA (LLM) step
#   GITHUB_TOKEN        needed only for git-commit correlation
#   SLACK_WEBHOOK_URL   needed only for Slack notifications; leave unset to
#                       disable Slack entirely.
#
# LLM_PROVIDER / *_MODEL are deliberately NOT set here. They live in the
# backend ConfigMap so a Secret can never silently override the provider.
# OpenSRE asks for a fixed 4096 output tokens per call, so the key's own limit
# must be high enough to afford one full request.
#
# SLACK_WEBHOOK_URL is read by the backend only. It is never exposed to the
# frontend and never written to disk.

apiVersion: v1
kind: Secret
metadata:
  name: opensre-backend-secrets
  namespace: opensre
type: Opaque
stringData:
  OPENROUTER_API_KEY: "replace-me"
  GITHUB_TOKEN: "replace-me"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/replace/me"
