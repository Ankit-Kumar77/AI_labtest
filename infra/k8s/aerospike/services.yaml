apiVersion: v1
kind: Service
metadata:
  name: aerospike
  namespace: databases
  labels:
    app: aerospike
spec:
  type: ClusterIP
  selector:
    app: aerospike
  ports:
    - name: service
      port: 3000
      targetPort: 3000
    - name: fabric
      port: 3001
      targetPort: 3001
    - name: mesh
      port: 3002
      targetPort: 3002
    - name: info
      port: 3003
      targetPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: aerospike-headless
  namespace: databases
  labels:
    app: aerospike
spec:
  clusterIP: None
  selector:
    app: aerospike
  ports:
    - name: service
      port: 3000
      targetPort: 3000
    - name: fabric
      port: 3001
      targetPort: 3001
    - name: mesh
      port: 3002
      targetPort: 3002
    - name: info
      port: 3003
      targetPort: 3003