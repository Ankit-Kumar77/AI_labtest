apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app: alertmanager
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      # One alertgroup per (alertname, namespace, pod) keeps the demo
      # incidents one-per-firing-symptom instead of a single blob.
      group_by: ['alertname', 'namespace', 'pod']
      group_wait: 10s
      group_interval: 30s
      # Repeat fast so the receiver exercises dedup on real traffic.
      repeat_interval: 1m
      receiver: opensre-backend
    receivers:
      - name: opensre-backend
        webhook_configs:
          # In-cluster Service DNS -- never localhost. The backend is
          # deployed in the `opensre` namespace (see ../opensre-backend).
          - url: http://opensre-backend.opensre.svc.cluster.local:8001/api/alerts/alertmanager
            send_resolved: true
            max_alerts: 0
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'namespace', 'pod']
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      serviceAccountName: alertmanager
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yaml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
  type: ClusterIP
