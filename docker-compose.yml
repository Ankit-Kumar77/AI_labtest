version: '3.8'

services:
  # NOTE: YugabyteDB and Aerospike now run as Kubernetes StatefulSets in the
  # `databases` namespace (infra/k8s/yugabytedb, infra/k8s/aerospike).
  # Do NOT run them here — `docker start yugabyte/aerospike` is obsolete and
  # will confuse the dashboard (backend reads K8s state, not docker).
  # Local backend accesses K8s DBs via port-forwards (see guide for running).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - opensre-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - opensre-network

networks:
  opensre-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local